# Covenant Study — Caddy site block for study.wittycomp.com
#
# Backend: wn-bible-01 container at 10.10.30.246:8000 (witty_vlan30 macvlan).
# TLS is handled by Caddy using the cloudflare_tls snippet (CF-issued wildcard cert).
#
# To apply: copy this block into /home/bearboss/wittycomp-lab/apps/caddy/Caddyfile
# and reload:  docker exec wn-caddy-01 caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile

study.wittycomp.com {
	import cloudflare_tls
	reverse_proxy 10.10.30.246:8000
}
