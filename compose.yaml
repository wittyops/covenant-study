services:
  covenant-study:
    build: .
    image: ghcr.io/bearboss/wn-bible-01:latest
    container_name: wn-bible-01
    mem_limit: 256m
    memswap_limit: 256m
    restart: unless-stopped
    volumes:
      - bible-notes:/app/notes
      - bible-userdata:/app/userdata
    networks:
      witty_vlan30:
        ipv4_address: ${APP_IP:-10.10.30.246}
    labels:
      - homepage.group=Christ Pillar
      - homepage.name=Covenant Study
      - homepage.description=Bible study platform — Strong's, interlinear, maps, cross-references
      - homepage.icon=https://cdn.jsdelivr.net/npm/simple-icons@latest/icons/read-dot-cv.svg

volumes:
  bible-notes:
    driver: local
  bible-userdata:
    driver: local

networks:
  witty_vlan30:
    external: true
